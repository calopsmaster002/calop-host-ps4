<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Host PS4</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 { color: #58a6ff; margin-bottom: 10px; }
        p { color: #8b949e; font-size: 0.95rem; margin-bottom: 20px; }
        .status {
            background-color: #21262d;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 6px;
            color: #7ee787;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background-color: #2ea043; }
    </style>
</head>
<body>

<div class="card">
    <h1>Meu Host PS4</h1>
    <p>Painel Pessoal em HTML</p>
    
    <div id="status" class="status">Página Carregada!</div>

    <button class="btn" onclick="executarTeste()">Testar Botão</button>
</div>

<script>
    function executarTeste() {
        document.getElementById('status').innerText = "Funcionando sem erros!";
    }
</script>

</body>
</html>
